name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(python -c 'import glassly_flasher as g; print(g.__version__)')" = "$GITHUB_REF_NAME"
      - run: python -m pip install -r requirements-build.txt
      - run: python -c "import tkinter; tkinter.Tcl()"
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
      - run: python scripts/smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: flasher-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"
          --title "Glassly CFW Flasher $GITHUB_REF_NAME" --notes-file packaging/release-notes.md
